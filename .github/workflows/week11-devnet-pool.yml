name: Week 11 Devnet CLMM pool
# Creates the week 11 pool on the official Devnet with a throwaway Devnet-only wallet kept in the
# repository secret DEVNET_CI_KEYPAIR (funded via faucet.solana.com), then commits
# 06-clmm-vault/pool-devnet.json. The key is never committed or printed; no personal keys are used.
on:
  workflow_dispatch:
  push:
    branches: [weeks11-13-current-assignment]
    paths: ['.github/workflows/week11-devnet-pool.yml']
permissions:
  contents: write
jobs:
  devnet-pool:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: 06-clmm-vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Devnet wallet from the DEVNET_CI_KEYPAIR secret (throwaway, Devnet only)
        env:
          KEY: ${{ secrets.DEVNET_CI_KEYPAIR }}
        run: |
          if [ -z "$KEY" ]; then echo "Secret DEVNET_CI_KEYPAIR is not set"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/w" evidence
          printf '%s' "$KEY" > "$RUNNER_TEMP/w/ci.json"
          node -e '
            const {Keypair,Connection,LAMPORTS_PER_SOL}=require("@solana/web3.js");const fs=require("fs");
            (async()=>{
              const kp=Keypair.fromSecretKey(Uint8Array.from(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/w/ci.json","utf8"))));
              const bal=await new Connection("https://api.devnet.solana.com","confirmed").getBalance(kp.publicKey);
              console.log("CI wallet:",kp.publicKey.toBase58(),"balance:",bal/LAMPORTS_PER_SOL,"SOL");
              if(bal<0.2*LAMPORTS_PER_SOL)throw new Error("Fund this address on https://faucet.solana.com (Devnet)");
            })().catch(e=>{console.error(e.message);process.exit(1)});
          '
      - name: Create the pool on Devnet (week 11 script)
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
        run: |
          ANCHOR_WALLET="$RUNNER_TEMP/w/ci.json" npm run create-pool 2>&1 | tee evidence/week11-devnet-create-pool.txt
          test -f pool-devnet.json && cat pool-devnet.json
      - name: Commit pool-devnet.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool-devnet.json evidence/week11-devnet-create-pool.txt
          git commit -m "Week 11: Devnet CLMM pool $(node -p 'require(\"./pool-devnet.json\").poolId')"
          git push origin HEAD:${GITHUB_REF_NAME}
