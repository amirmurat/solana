name: Weeks 11–13 real Raydium integration
on:
  workflow_dispatch:
  push:
    branches: [weeks11-13-raydium]
    paths: ['06-raydium-vault/**', '.github/workflows/weeks11-13.yml']
  pull_request:
    paths: ['06-raydium-vault/**', '.github/workflows/weeks11-13.yml']
permissions:
  contents: read
jobs:
  raydium-localnet:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: 06-raydium-vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 06-raydium-vault/package-lock.json
      - name: Install pinned Solana and Anchor
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          cargo install anchor-cli --version 0.31.1 --locked
      - run: npm ci
      - name: Generate isolated local program identity
        run: |
          mkdir -p target/deploy
          solana-keygen new --silent --no-bip39-passphrase --outfile target/deploy/raydium_vault-keypair.json >/dev/null
          anchor keys sync
      - name: Build and Rust checks
        run: |
          mkdir -p evidence
          anchor build 2>&1 | tee evidence/ci-build.txt
          cargo test --lib 2>&1 | tee evidence/ci-rust-tests.txt
      - name: Test actual Raydium binary with own tokens and pool
        run: bash scripts/test-raydium-local.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weeks11-13-public-evidence
          path: 06-raydium-vault/evidence/
