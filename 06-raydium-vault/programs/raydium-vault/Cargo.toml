[package]
name = "raydium-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
[lib]
crate-type = ["cdylib", "lib"]
name = "raydium_vault"
[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token", "memo"] }

raydium-clmm-cpi = { git = "https://github.com/raydium-io/raydium-cpi", rev = "5aeec4b40b09c7f42e28a0f697132b76de872856", features = ["devnet"] }
